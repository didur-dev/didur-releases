name: pedagios
# A lista de cabines de pedágio do Brasil para o Didur Driver (#490): toda segunda e à mão.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pedagios-brasil.py
      - run: |
          git config user.name "didur-bot"
          git config user.email "admin@didur.dev.br"
          git add pedagios-br.json
          git diff --cached --quiet || git commit -m "pedágios: $(date -u +%F)"
          git push
